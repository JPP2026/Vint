spring.application.name=vint
server.port=8080

# --- BDD H2 ---
# Mode "file" pour que la base soit sauvegardée dans le dossier data/ du projet
# (le prof veut qu'elle soit présente dans le repo). AUTO_SERVER permet d'ouvrir
# la console H2 pendant que l'appli tourne.
spring.datasource.url=jdbc:h2:file:./data/vintdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Console H2 dispo sur http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# update = Hibernate crée/modifie les tables tout seul sans effacer les données
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Open-in-view : la session Hibernate reste ouverte jusqu'à la fin du rendu de la vue.
# Ça permet d'afficher les relations LAZY dans Thymeleaf (ex : annonce.vendeur.profil.ville)
# sans LazyInitializationException. Spring l'active par défaut, on le met explicitement
# pour enlever le warning au démarrage et parce que c'est un choix assumé.
spring.jpa.open-in-view=true

# --- Upload des photos ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
vint.dossier-uploads=uploads

# --- Thymeleaf ---
# pas de cache en dev pour voir les modifs des templates direct
spring.thymeleaf.cache=false
